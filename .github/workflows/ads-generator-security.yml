name: Ads Generator Security Checks
on:
  pull_request:
  push:
    branches:
      - security/initial-api-hardening

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3LABABEE_OpenRouter_Production_Render/3lababee-openrouter-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 3LABABEE_OpenRouter_Production_Render/3lababee-openrouter-production/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node tests/smoke.mjs
      - run: node tests/timeout.mjs
